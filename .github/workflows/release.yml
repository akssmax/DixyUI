name: Release
# On main, changesets either opens a "Version packages" PR or, when that PR
# has been merged, publishes the changed packages to npm with provenance.
# Packages marked "private" are never published. Needs an NPM_TOKEN secret
# (an npm automation or granular token for the dixy-ui organisation).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm package:check --online
      # v2 is required for Changesets CLI 3: v1 mistakes the CLI 3
      # `.changeset/pre/` folder for an old-format changeset and fails.
      # v2 does not write .npmrc; setup-node's registry-url above reads
      # NODE_AUTH_TOKEN instead.
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: "Version packages"
          pr-title: "Version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
