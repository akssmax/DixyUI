name: Quality checks
# Runs on pull requests and on pushes to main. The docs deploy is a second
# job that only starts once every check has passed, so a broken main never
# reaches production. Needs repository secrets CLOUDFLARE_API_TOKEN
# (Workers Scripts: Edit, Workers KV Storage: Edit) and CLOUDFLARE_ACCOUNT_ID;
# until they exist, the deploy steps are skipped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main queue so a production
  # deploy is never interrupted halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo's local cache persists between runs. The key is unique per
      # commit so each run saves a fresh copy; restore-keys pick the newest.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      # Reuses the builds from `pnpm check` through the turbo cache.
      - run: pnpm package:check --online
      # Entries not rewritten in a week are dropped before the cache is
      # saved, so it doesn't grow forever.
      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  deploy-docs:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Restore only: the check job just saved this commit's cache.
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # Builds tokens, react and themes, then the docs Worker (turbo orders
      # it). With the restored cache this is mostly replayed output.
      - run: pnpm build
      - name: Deploy to production
        if: env.HAS_CLOUDFLARE == 'true' && github.event_name != 'pull_request'
        working-directory: apps/docs
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pull requests from this repository get a preview URL; production is untouched.
      - name: Upload preview version
        if: env.HAS_CLOUDFLARE == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/docs
        run: pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Cloudflare not connected
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Docs built. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."
