name: Quality checks
# Pushes to main, plus every pull request. Running on every push as well
# checked each PR commit twice (once as a push, once as a pull request).
on:
  push:
    branches: [main]
  pull_request:
# A newer commit on the same PR cancels the older run; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm package:check --online
